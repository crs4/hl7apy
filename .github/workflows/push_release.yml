name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools-scm needs the tags to compute the version
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Build the sdist and the wheel
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build
    - name: Store the packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # must match the environment configured in the PyPI trusted publisher
    environment:
      name: pypi
      url: https://pypi.org/p/hl7apy
    permissions:
      id-token: write  # needed by PyPI trusted publishing

    steps:
    - name: Download the packages
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
